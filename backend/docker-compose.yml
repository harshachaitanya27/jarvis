# Local stack: Postgres + the Jarvis API.
# Secrets come from a local .env (KEY_ENCRYPTION_KEY, JWT_SECRET); compose reads
# it automatically. Bring up with: docker compose up --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jarvis
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/jarvis
      KEY_ENCRYPTION_KEY: ${KEY_ENCRYPTION_KEY}
      JWT_SECRET: ${JWT_SECRET}
      STORAGE_PROVIDER: local
      APP_ENV: production
    # Apply migrations, then serve.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"

volumes:
  pgdata:
