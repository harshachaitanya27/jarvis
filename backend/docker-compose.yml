# Local stack: Postgres + the Jarvis API.
# Secrets come from a local .env (KEY_ENCRYPTION_KEY, JWT_SECRET); compose reads
# it automatically. Bring up with: docker compose up --build
#
# Optional telemetry: `docker compose --profile observability up` also starts
# the LGTM stack (Grafana + Loki + Tempo + Mimir); set OTEL_ENABLED=true to ship
# signals to it, then open Grafana at http://localhost:3000.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jarvis
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/jarvis
      KEY_ENCRYPTION_KEY: ${KEY_ENCRYPTION_KEY}
      JWT_SECRET: ${JWT_SECRET}
      STORAGE_PROVIDER: local
      APP_ENV: production
      # Off by default; set OTEL_ENABLED=true (with the observability profile up)
      # to ship signals to the LGTM container over the compose network.
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
    # Apply migrations, then serve.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"

  # Optional all-in-one telemetry backend: Grafana + Loki + Tempo + Mimir, plus
  # an OTel Collector. Started only with: docker compose --profile observability up
  otel-lgtm:
    image: grafana/otel-lgtm:latest
    profiles: ["observability"]
    ports:
      - "3000:3000"   # Grafana UI  -> http://localhost:3000
      - "4317:4317"   # OTLP/gRPC
      - "4318:4318"   # OTLP/HTTP

volumes:
  pgdata:
